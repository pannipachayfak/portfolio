<!DOCTYPE html>

<head>

content="width=device-width, initial-scale=1.0">

<title>Portfolio | พรรณนิภา ฉายฝาก</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Kanit',sans-serif;
    background:#f7f7f7;
    color:#222;
}

/* NAVBAR */

nav{
    position:sticky;
    top:0;
    z-index:999;
    background:rgba(17,17,17,0.97);
    padding:15px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 20px rgba(0,0,0,0.2);
}

.logo{
    color:white;
    font-size:25px;
    font-weight:700;
}

.logo span{
    color:#b5121b;
}

nav ul{
    list-style:none;
    display:flex;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:13px;
    transition:0.3s;
}

nav a:hover{
    color:#e52a35;
}


/* HOME */

.hero{

    min-height:92vh;

    background:
    radial-gradient(circle at 10% 20%,#b5121b 0 5px,transparent 6px),
    radial-gradient(circle at 90% 80%,#b5121b 0 5px,transparent 6px),
    linear-gradient(135deg,#111 0%,#191919 65%,#b5121b 65%);

    display:flex;
    align-items:center;
    justify-content:center;

    padding:70px 8%;

    color:white;

    position:relative;

    overflow:hidden;
}

.hero::before{
    content:"✦";
    position:absolute;
    top:100px;
    left:8%;
    color:#b5121b;
    font-size:55px;
}

.hero::after{
    content:"♡";
    position:absolute;
    bottom:70px;
    right:8%;
    color:white;
    opacity:.6;
    font-size:50px;
}

.hero-content{

    width:100%;
    max-width:1100px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:60px;
}

.hero-text{
    flex:1;
}

.tag{

    display:inline-block;

    border:1px solid #b5121b;

    color:#ff6a72;

    padding:7px 17px;

    border-radius:30px;

    font-size:14px;

    margin-bottom:20px;
}

.hero h1{

    font-size:clamp(50px,8vw,85px);

    line-height:.95;

    letter-spacing:4px;

    margin-bottom:20px;
}

.hero h1 span{
    color:#e32632;
}

.hero h2{

    font-size:30px;

    font-weight:400;

    margin-bottom:10px;
}

.hero p{

    color:#ddd;

    font-size:17px;

    line-height:1.8;
}

.hero-button{

    display:inline-block;

    margin-top:25px;

    padding:12px 25px;

    background:#b5121b;

    color:white;

    border-radius:30px;

    text-decoration:none;

    transition:.3s;
}

.hero-button:hover{
    background:white;
    color:#b5121b;
}


/* PROFILE */

.hero-image{

    width:320px;
    height:390px;

    background:white;

    padding:9px;

    border-radius:160px 160px 30px 30px;

    box-shadow:0 15px 50px rgba(0,0,0,.45);

    transform:rotate(2deg);
}

.hero-image img{

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:150px 150px 22px 22px;
}


/* FOOTER */

footer{

    background:#080808;

    color:#888;

    text-align:center;

    padding:22px;

    font-size:13px;
}


/* MOBILE */

@media(max-width:750px){

    nav{
        flex-direction:column;
        gap:12px;
    }

    nav ul{
        gap:9px;
        flex-wrap:wrap;
        justify-content:center;
    }

    nav a{
        font-size:11px;
    }

    .hero{
        padding:60px 7%;
    }

    .hero-content{
        flex-direction:column-reverse;
        text-align:center;
    }

    .hero-image{
        width:250px;
        height:310px;
    }

    .hero h1{
        font-size:55px;
    }

}

</style>

</head>

<body>

                MY PERSONAL PORTFOLIO
            </div>

            <h1>
                PORT<span>FOLIO</span>
            </h1>

            <h2>
                พรรณนิภา ฉายฝาก

            <p>
                Student • Engineering • Technology • Creativity
            </p>

            <a href="about.html" class="hero-button">

        </div>

                src="profile.jpg"
